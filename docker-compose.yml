services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeos
      POSTGRES_PASSWORD: tradeos
      POSTGRES_DB: tradeos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeos -d tradeos"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tradeos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every outbound email in development. UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: tradeos-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
